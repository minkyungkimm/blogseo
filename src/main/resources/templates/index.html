<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO 블로그 도우미</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="header-logo">SEO <span>블로그 도우미</span></div>
</header>

<main>
    <!-- 검색 섹션 -->
    <div class="hero">
        <h1 class="hero-title">블로그 키워드를<br><span>분석</span>해 드립니다</h1>
        <p class="hero-subtitle">검색량 조회 · 해시태그 추천 · SEO 제목 생성</p>

        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" id="keywordInput"
                       placeholder="키워드를 입력하세요 (예: 제주도 여행)"
                       maxlength="50" autocomplete="off">
                <button class="search-button" id="searchButton" onclick="handleSearch()">
                    분석하기
                </button>
            </div>
            <div class="search-hint">
                <span>예시:</span>
                <span class="hint-tag" onclick="fillKeyword('제주도 여행')">제주도 여행</span>
                <span class="hint-tag" onclick="fillKeyword('다이어트 식단')">다이어트 식단</span>
                <span class="hint-tag" onclick="fillKeyword('독서 습관')">독서 습관</span>
            </div>
        </div>

        <!-- 에러 메시지 -->
        <div class="error-box" id="errorBox" style="display:none">
            <span id="errorMessage"></span>
        </div>
    </div>

    <!-- 결과 섹션 -->
    <div class="results-section" id="resultsSection" style="display:none">

        <!-- SEO 점수 카드 -->
        <div class="seo-score-card">
            <div class="seo-score-left">
                <div class="seo-score-label">SEO 점수</div>
                <div class="seo-score-value" id="seoScoreValue">-</div>
                <div class="seo-score-stars" id="seoScoreStars"></div>
            </div>
            <div class="seo-score-right">
                <div class="seo-sub-item">
                    <span class="seo-sub-label">검색량</span>
                    <span class="seo-sub-stars" id="searchVolumeStars"></span>
                    <span class="seo-sub-level" id="searchVolumeLevel"></span>
                </div>
                <div class="seo-sub-item">
                    <span class="seo-sub-label">경쟁도</span>
                    <span class="seo-sub-stars" id="competitionStars"></span>
                    <span class="seo-sub-level" id="competitionLevel"></span>
                </div>
                <div class="seo-sub-item">
                    <span class="seo-sub-label">추천도</span>
                    <span class="seo-sub-stars" id="recommendStars"></span>
                    <span class="seo-sub-level" id="recommendLevel"></span>
                </div>
            </div>
        </div>

        <!-- 통계 카드 3개 -->
        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-label">현재 검색 인기도</div>
                <div class="stat-value" id="currentRatioValue">-</div>
                <div class="stat-sub">/ 100점 기준</div>
                <span class="level-badge" id="popularityBadge"></span>
            </div>
            <div class="stat-card">
                <div class="stat-label">최고 인기 시점</div>
                <div class="stat-value" id="peakPeriodValue">-</div>
                <div class="stat-sub" id="peakRatioValue"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">최근 트렌드</div>
                <div class="trend-badge" id="trendBadge">-</div>
                <div class="stat-sub" id="trendDesc"></div>
            </div>
        </div>

        <!-- 트렌드 차트 -->
        <div class="chart-box">
            <div class="box-header">
                <h3 class="box-title">검색 트렌드 <span class="box-subtitle">최근 12개월</span></h3>
            </div>
            <canvas id="trendChart" height="80"></canvas>
        </div>

        <!-- 연관 키워드 -->
        <div class="keywords-box">
            <div class="box-header">
                <h3 class="box-title">연관 키워드 인기도</h3>
                <span class="box-subtitle">기본 키워드 대비 상대 비율</span>
            </div>
            <div id="relatedKeywordsList"></div>
        </div>

        <!-- 해시태그 추천 -->
        <div class="hashtag-box">
            <div class="box-header">
                <h3 class="box-title">해시태그 추천</h3>
                <span class="box-subtitle">네이버 블로그용 · 최대 30개</span>
                <button class="copy-all-btn" onclick="copyHashtags()">전체 복사</button>
            </div>
            <div id="hashtagArea" class="hashtag-area">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>
        </div>

        <!-- SEO 제목 추천 -->
        <div class="titles-box">
            <div class="box-header">
                <h3 class="box-title">SEO 제목 추천</h3>
                <span class="box-subtitle">클릭률 점수 기준 상위 20개</span>
                <button class="copy-all-btn" onclick="copyAllTitles()">전체 복사</button>
            </div>
            <div id="titlesList" class="titles-loading">
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
                <div class="skeleton-row"></div>
            </div>
        </div>

    </div>
</main>

<footer>&copy; 2025 SEO 블로그 도우미</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
